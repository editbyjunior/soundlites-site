name: Deploy to Trust Edge

on:
  workflow_dispatch:
    inputs:
      target:
        description: Trust Edge target environment
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      release_sha:
        description: Full commit SHA from main to deploy
        required: true
        type: string
      transport:
        description: Upload transport (sftp uses a pinned SSH host key; ftps is the previous path, kept for rollback)
        required: true
        default: sftp
        type: choice
        options:
          - sftp
          - ftps

permissions:
  contents: read

concurrency:
  group: trust-edge-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload public_html payload
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    if: ${{ vars.TRUST_EDGE_DEPLOY_ENABLED == 'true' }}
    env:
      EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
      TRANSPORT: ${{ inputs.transport }}
      TRUST_EDGE_REMOTE_ROOT: ${{ vars.TRUST_EDGE_REMOTE_ROOT }}
      TRUST_EDGE_SSH_PORT: ${{ vars.TRUST_EDGE_SSH_PORT }}
      TRUST_EDGE_SSH_REMOTE_ROOT: ${{ vars.TRUST_EDGE_SSH_REMOTE_ROOT }}
      TRUST_EDGE_SOURCE_DIR: ${{ vars.TRUST_EDGE_SOURCE_DIR }}
      TRUST_EDGE_VERIFY_URLS: ${{ vars.TRUST_EDGE_VERIFY_URLS }}

    steps:
      - name: Confirm release from main
        run: |
          test "$GITHUB_REF_NAME" = "main"
          test "${#EXPECTED_RELEASE_SHA}" -eq 40
          test "$GITHUB_SHA" = "$EXPECTED_RELEASE_SHA"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Validate deploy configuration
        env:
          TRUST_EDGE_FTP_SERVER: ${{ secrets.TRUST_EDGE_FTP_SERVER }}
          TRUST_EDGE_FTP_USERNAME: ${{ secrets.TRUST_EDGE_FTP_USERNAME }}
          TRUST_EDGE_FTP_PASSWORD: ${{ secrets.TRUST_EDGE_FTP_PASSWORD }}
          TRUST_EDGE_SSH_HOST: ${{ secrets.TRUST_EDGE_SSH_HOST }}
          TRUST_EDGE_SSH_USERNAME: ${{ secrets.TRUST_EDGE_SSH_USERNAME }}
          TRUST_EDGE_SSH_PRIVATE_KEY: ${{ secrets.TRUST_EDGE_SSH_PRIVATE_KEY }}
          TRUST_EDGE_SSH_KNOWN_HOSTS: ${{ secrets.TRUST_EDGE_SSH_KNOWN_HOSTS }}
        run: |
          case "$TRANSPORT" in
            sftp)
              test -n "$TRUST_EDGE_SSH_HOST"
              test -n "$TRUST_EDGE_SSH_USERNAME"
              test -n "$TRUST_EDGE_SSH_PRIVATE_KEY"
              test -n "$TRUST_EDGE_SSH_KNOWN_HOSTS"
              ;;
            ftps)
              test -n "$TRUST_EDGE_FTP_SERVER"
              test -n "$TRUST_EDGE_FTP_USERNAME"
              test -n "$TRUST_EDGE_FTP_PASSWORD"
              ;;
            *)
              echo "Unknown transport: $TRANSPORT" >&2
              exit 1
              ;;
          esac

      - name: Prepare deploy payload
        run: scripts/prepare-trust-edge-deploy.sh

      - name: Upload deploy payload over SFTP
        if: ${{ inputs.transport == 'sftp' }}
        env:
          TRUST_EDGE_SSH_HOST: ${{ secrets.TRUST_EDGE_SSH_HOST }}
          TRUST_EDGE_SSH_USERNAME: ${{ secrets.TRUST_EDGE_SSH_USERNAME }}
          TRUST_EDGE_SSH_PRIVATE_KEY: ${{ secrets.TRUST_EDGE_SSH_PRIVATE_KEY }}
          TRUST_EDGE_SSH_KNOWN_HOSTS: ${{ secrets.TRUST_EDGE_SSH_KNOWN_HOSTS }}
        run: scripts/upload-trust-edge-sftp.sh .trust-edge-deploy

      - name: Upload deploy payload over FTPS
        if: ${{ inputs.transport == 'ftps' }}
        env:
          TRUST_EDGE_FTP_SERVER: ${{ secrets.TRUST_EDGE_FTP_SERVER }}
          TRUST_EDGE_FTP_USERNAME: ${{ secrets.TRUST_EDGE_FTP_USERNAME }}
          TRUST_EDGE_FTP_PASSWORD: ${{ secrets.TRUST_EDGE_FTP_PASSWORD }}
        run: |
          payload=".trust-edge-deploy"
          root="${TRUST_EDGE_REMOTE_ROOT#/}"
          root="${root%/}"

          encode_path() {
            python3 -c 'import sys; from urllib.parse import quote; print("/".join(quote(part) for part in sys.argv[1].split("/")))' "$1"
          }

          find "$payload" -type f -print0 | while IFS= read -r -d '' file; do
            name="${file#$payload/}"
            if [ -n "$root" ]; then
              remote_path="$root/$name"
            else
              remote_path="$name"
            fi
            encoded_path="$(encode_path "$remote_path")"
            echo "Uploading $name"
            curl --fail --silent --show-error \
              --connect-timeout 20 \
              --max-time 120 \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              --ssl-reqd \
              --ftp-create-dirs \
              --user "$TRUST_EDGE_FTP_USERNAME:$TRUST_EDGE_FTP_PASSWORD" \
              --upload-file "$file" \
              "ftp://$TRUST_EDGE_FTP_SERVER/$encoded_path"
          done

      - name: Verify live URLs
        if: ${{ vars.TRUST_EDGE_VERIFY_URLS != '' }}
        run: |
          printf '%s\n' "$TRUST_EDGE_VERIFY_URLS" | while IFS= read -r url; do
            [ -n "$url" ] || continue
            curl -fsSL \
              --user-agent "Mozilla/5.0 TrustEdgeDeployVerifier/1.0" \
              --output /dev/null \
              --write-out "%{url_effective} %{http_code}\n" \
              --retry 3 \
              --retry-delay 2 \
              --max-time 20 \
              "$url"
          done
