name: Repo Standards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repo-standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf /tmp/gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-banner

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - run: python -m pip install pre-commit==4.6.2
      - name: Run pre-commit checks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SKIP=gitleaks pre-commit run --from-ref "${{ github.event.pull_request.base.sha }}" --to-ref HEAD
          else
            SKIP=gitleaks pre-commit run --all-files
          fi
